  illustrative_4second_wave_GiB: 2.1562576293945312
  hard_proposed_cache_cap_GiB: 8
  hard_proposed_outputs_cap_GiB: 2
  fusion_runs: 'H1: 6 families x 4 trials x 3 seeds x 2 crop policies = 144 runs,
