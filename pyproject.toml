[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ontoresponse"
version = "0.5.0"
description = "Utterance anti-spoofing from frozen expert and diagnostic response evidence"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "numpy>=1.24,<3", "scipy>=1.10,<2", "soundfile>=0.12,<1", "PyYAML>=6", "scikit-learn>=1.2,<2", "psutil>=5,<8"]

[project.optional-dependencies]
ontology = ["rdflib>=6", "pyshacl>=0.25"]
pilot = ["matplotlib>=3.7,<4"]
test = ["pytest>=7", "rdflib>=6", "pyshacl>=0.25"]

[project.scripts]
ontoresponse = "ontoresponse.cli:main"

[tool.setuptools.packages.find]
include = ["ontoresponse*", "reference*"]

[tool.setuptools.package-data]
ontoresponse = ["_resources/configs/*.yaml", "_resources/ontology/*.ttl"]
